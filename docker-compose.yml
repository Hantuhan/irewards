services:
  irewards:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    restart: unless-stopped
    # Zeabur production: set Variables in dashboard (see .env.zeabur.example).
    # Local prod test: copy .env.zeabur → .env.local or use --env-file .env.zeabur
    env_file:
      - .env.local
    environment:
      PORT: "8080"
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-supabase}
