services:
  irewards:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-3002}:3000"
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3002}
      NEXT_PUBLIC_INSFORGE_URL: ${NEXT_PUBLIC_INSFORGE_URL:-http://localhost:7230}
      INSFORGE_URL: ${INSFORGE_URL:-http://host.docker.internal:7230}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
